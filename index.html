<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#0d242a">
  <title>تسجيل الدخول | الموسوعة التخديرية السريرية الشاملة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at center, #0e2930 0%, #061317 100%);
      color: #F1F7F8;
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 430px;
      margin: auto;
    }
    .login-card {
      background: rgba(17, 39, 46, 0.95);
      border: 1px solid #1E3F48;
      border-radius: 22px;
      padding: 32px 26px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 35px rgba(45, 212, 191, 0.15);
      text-align: center;
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #0F5C67, #2DD4BF, #38BDF8);
    }
    .login-logo {
      width: 74px;
      height: 74px;
      background: rgba(45, 212, 191, 0.1);
      border: 1px solid rgba(45, 212, 191, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 33px;
      margin: 0 auto 16px;
      box-shadow: 0 0 25px rgba(45, 212, 191, 0.25);
    }
    h1 {
      color: #F1F7F8;
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 5px;
    }
    p.subtitle {
      color: #8EA8B0;
      font-size: 13px;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .login-field {
      margin-bottom: 16px;
      text-align: right;
    }
    .login-field label {
      display: block;
      color: #8EA8B0;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper span.input-icon {
      position: absolute;
      right: 14px;
      font-size: 16px;
      color: #8EA8B0;
      pointer-events: none;
    }
    .input-wrapper input {
      width: 100%;
      padding: 12px 42px 12px 14px;
      background: #0C1E23;
      border: 1px solid #1E3F48;
      border-radius: 12px;
      color: #F1F7F8;
      font-family: inherit;
      font-size: 14.5px;
      transition: all 0.2s ease;
    }
    .input-wrapper input:focus {
      outline: none;
      border-color: #2DD4BF;
      box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.15);
    }
    .input-wrapper button.toggle-pwd {
      position: absolute;
      left: 12px;
      background: none;
      border: none;
      color: #8EA8B0;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }
    .login-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #0F5C67 0%, #158392 100%);
      border: 1px solid rgba(45, 212, 191, 0.4);
      border-radius: 12px;
      color: #F1F7F8;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(15, 92, 103, 0.3);
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .login-btn:hover {
      background: linear-gradient(135deg, #137785 0%, #1ba2b5 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(45, 212, 191, 0.3);
    }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .login-alert {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: right;
      font-weight: 500;
    }
    .login-alert.error {
      display: block;
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: #F87171;
    }
    .login-alert.success {
      display: block;
      background: rgba(45, 212, 191, 0.15);
      border: 1px solid rgba(45, 212, 191, 0.4);
      color: #2DD4BF;
    }

    /* CONTACT SECTION */
    .contact-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #1E3F48;
      text-align: center;
    }
    .contact-title {
      font-size: 12.5px;
      color: #8EA8B0;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-contact {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.25s ease;
    }
    .btn-tg {
      background: rgba(36, 161, 222, 0.12);
      border: 1px solid rgba(36, 161, 222, 0.4);
      color: #38BDF8;
    }
    .btn-tg:hover {
      background: #24A1DE;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(36, 161, 222, 0.4);
      transform: translateY(-2px);
    }
    .btn-ig {
      background: rgba(225, 48, 108, 0.12);
      border: 1px solid rgba(225, 48, 108, 0.4);
      color: #FB7185;
    }
    .btn-ig:hover {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(225, 48, 108, 0.4);
      transform: translateY(-2px);
    }
    .btn-contact svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }
    .footer-badge {
      margin-top: 16px;
      font-size: 11.5px;
      color: #617D87;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-logo">💉</div>
    <h1>الموسوعة التخديرية السريرية</h1>
    <p class="subtitle">Anesthesia & ICU Master Workstation<br>بوابة المشتركين المعتمدين</p>

    <div id="login-alert" class="login-alert"></div>

    <form id="login-form" onsubmit="handleUserLogin(event)">
      <div class="login-field">
        <label for="login-username">اسم المستخدم (Username)</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="login-username" required placeholder="أدخل اسم المستخدم المصرح به" autocomplete="username">
        </div>
      </div>

      <div class="login-field">
        <label for="login-password">كلمة المرور (Password)</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="login-password" required placeholder="أدخل كلمة المرور" autocomplete="current-password">
          <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('login-password')">👁️</button>
        </div>
      </div>

      <button type="submit" id="login-submit-btn" class="login-btn">
        <span>تسجيل الدخول</span>
      </button>
    </form>

    <!-- CONTACT LINKS -->
    <div class="contact-section">
      <div class="contact-title">للاشتراك وتفعيل الحساب تواصل معنا مباشرة:</div>
      <div class="contact-grid">
        <a href="https://t.me/ddd4dddd" target="_blank" rel="noopener noreferrer" class="btn-contact btn-tg">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
          <span>تليجرام</span>
        </a>

        <a href="https://instagram.com/3i9ik" target="_blank" rel="noopener noreferrer" class="btn-contact btn-ig">
          <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
          <span>انستغرام</span>
        </a>
      </div>
      <div class="footer-badge">By: Komail Nabeel / B.M.T Of Anesthesia & ICU</div>
    </div>
  </div>
</div>

<script>
  // --- FIREBASE CONFIGURATION ---
  const firebaseConfig = {
    apiKey: "AIzaSyAibJ6AdbZgW_Xjz1ips8OMEsNUfY9au9w",
    authDomain: "anesthesia-a11fa.firebaseapp.com",
    projectId: "anesthesia-a11fa",
    storageBucket: "anesthesia-a11fa.firebasestorage.app",
    messagingSenderId: "194393218681",
    appId: "1:194393218681:web:aa3dbd2b562ec356727ea8",
    measurementId: "G-Y0FFFVNNFR"
  };

  const ADMIN_CREDENTIALS = {
    username: "komail",
    password: "kom04"
  };

  let firestoreDb = null;
  let isFirebaseReady = false;

  try {
    if (typeof firebase !== 'undefined') {
      firebase.initializeApp(firebaseConfig);
      firestoreDb = firebase.firestore();
      isFirebaseReady = true;
    }
  } catch (err) {
    console.error("Firebase init error:", err);
  }

  function togglePasswordVisibility(id) {
    const input = document.getElementById(id);
    if (input) input.type = input.type === 'password' ? 'text' : 'password';
  }

  function showAlert(msg, type = 'error') {
    const el = document.getElementById('login-alert');
    if (!el) return;
    el.className = 'login-alert ' + type;
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideAlert() {
    const el = document.getElementById('login-alert');
    if (el) el.style.display = 'none';
  }

  // --- AUTO REDIRECT IF ALREADY AUTHENTICATED ---
  (function() {
    const s = localStorage.getItem('anesthesia_session');
    if (s) {
      try {
        const session = JSON.parse(s);
        if (session && session.username) {
          window.location.replace('app.html');
        }
      } catch(e) {}
    }
  })();

  async function handleUserLogin(e) {
    if (e) e.preventDefault();
    hideAlert();

    const uInput = document.getElementById('login-username');
    const pInput = document.getElementById('login-password');
    const submitBtn = document.getElementById('login-submit-btn');

    const username = (uInput ? uInput.value : '').trim().toLowerCase();
    const password = (pInput ? pInput.value : '').trim();

    if (!username || !password) {
      showAlert('يرجى كتابة اسم المستخدم وكلمة المرور.', 'error');
      return;
    }

    // 1. Admin Verification
    if (username === ADMIN_CREDENTIALS.username.toLowerCase() && password === ADMIN_CREDENTIALS.password) {
      const session = {
        username: 'komail',
        role: 'admin',
        name: 'المدير كميل',
        loggedAt: new Date().toISOString()
      };
      localStorage.setItem('anesthesia_session', JSON.stringify(session));
      showAlert('تم تسجيل الدخول بنجاح! جاري تحويلك للمنظومة...', 'success');
      setTimeout(() => {
        window.location.replace('app.html');
      }, 400);
      return;
    }

    // 2. Subscriber Verification via Firebase Firestore
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>جاري التحقق من الاشتراك...</span>';
    }

    try {
      if (!isFirebaseReady || !firestoreDb) {
        throw new Error("قاعدة بيانات Firebase غير متصلة. تحقق من اتصالك بالإنترنت.");
      }

      const docSnap = await firestoreDb.collection('subscribers').doc(username).get();

      if (docSnap.exists) {
        const data = docSnap.data();
        if (data.password === password) {
          if (data.status === 'blocked' || data.status === 'inactive') {
            showAlert('عذراً، هذا الحساب معطل حالياً. يُرجى مراجعة إدارة النظام.', 'error');
            return;
          }

          // Check expiration
          if (data.expiresAt) {
            const expTime = new Date(data.expiresAt).getTime();
            if (Date.now() > expTime) {
              showAlert('عذراً، لقد انتهت صلاحية اشتراكك. تواصل معنا لتجديد الاشتراك.', 'error');
              return;
            }
          }

          const session = {
            username: data.username || username,
            role: 'subscriber',
            name: data.name || username,
            expiresAt: data.expiresAt || null,
            loggedAt: new Date().toISOString()
          };
          localStorage.setItem('anesthesia_session', JSON.stringify(session));
          showAlert('تم تسجيل الدخول بنجاح! جاري تحويلك للمنظومة...', 'success');
          setTimeout(() => {
            window.location.replace('app.html');
          }, 400);
        } else {
          showAlert('كلمة المرور غير صحيحة.', 'error');
        }
      } else {
        showAlert('اسم المستخدم غير مسجل ضمن المشتركين المعتمدين. تواصل معنا للاشتراك.', 'error');
      }
    } catch (err) {
      console.error("Login check error:", err);
      let errText = 'خطأ أثناء التحقق: ';
      if (err.code === 'permission-denied') {
        errText += 'يرجى مراجعة صلاحيات Firestore في لوحة Firebase.';
      } else {
        errText += (err.message || 'تحقق من اتصال الإنترنت.');
      }
      showAlert(errText, 'error');
    } finally {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>تسجيل الدخول</span>';
      }
    }
  }
</script>

</body>
</html>
